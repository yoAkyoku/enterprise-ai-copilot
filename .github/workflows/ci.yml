name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  codeql:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@3ce22a6e336a7fcc318bc58ae1986395bdc83ba7 # v4.35.4
        with:
          languages: python
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@3ce22a6e336a7fcc318bc58ae1986395bdc83ba7 # v4.35.4
        with:
          category: /language:python

  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: agent_platform
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: smoke-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip setuptools wheel && python -m pip install ".[dev,security,production]"
      - name: Compile
        run: python -m compileall -q packages services tests scripts apps
      - name: Lint
        run: python -m ruff check packages services tests scripts
      - name: Format check
        run: python -m ruff format --check packages services tests scripts
      - name: Unit and contract tests
        env:
          AGENT_TEST_POSTGRES_URL: postgresql://agent:smoke-password@127.0.0.1:5432/agent_platform
        run: python -m unittest discover -s tests -v
      - name: Manifest and repository validation
        run: python -m services.cli validate && python -m services.cli doctor
      - name: Production Compose configuration
        run: docker compose --project-directory . -f deploy/docker-compose.production.yml config --quiet
      - name: Scheduler E2E smoke
        run: python -m scripts.scheduler_e2e_smoke
      - name: Secret scan
        run: python scripts/check_secrets.py --git-history
      - name: Dependency audit
        run: python -m pip_audit
      - name: Dependency consistency
        run: python -m pip check
      - name: Generate SPDX package inventory
        run: python scripts/generate_sbom.py --output dist/sbom.spdx.json
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: enterprise-ai-copilot-release-artifacts
          path: |
            dist/*.whl
            dist/*.spdx.json

  container-smoke:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose configuration
        run: docker compose config --quiet
      - name: Build and start
        run: |
          docker build --tag enterprise-ai-copilot:ci .
          docker compose up -d --build
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Scan container image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          docker.io/aquasec/trivy@sha256:5c59e08f980b5d4d503329773480fcea2c9bdad7e381d846fbf9f2ecb8050f6b
          image --exit-code 1 --ignore-unfixed --vuln-type os,library
          --severity HIGH,CRITICAL enterprise-ai-copilot:ci
      - name: Verify production image assets
        run: >-
          docker run --rm --entrypoint python enterprise-ai-copilot:ci -c
          "from pathlib import Path; import psycopg; assert Path('/app/scripts/production_preflight.py').is_file(); assert Path('/app/scripts/connector_smoke.py').is_file(); assert Path('/app/scripts/migrate_postgres.py').is_file(); assert Path('/app/scripts/backup_postgres.py').is_file(); assert Path('/app/infra/migrations/postgres/001_run_events.sql').is_file(); print('production-image-assets: PASS')"
      - name: Stop stack
        if: always()
        run: docker compose down -v

  redis-worker-smoke:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install production queue dependency
        run: python -m pip install --upgrade pip setuptools wheel && python -m pip install ".[production]"
      - name: Redis worker smoke
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: python scripts/redis_worker_smoke.py
      - name: Scheduled Agent worker smoke
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: python scripts/worker_agent_smoke.py
