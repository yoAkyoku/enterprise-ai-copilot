name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip setuptools wheel && python -m pip install ".[dev,security,production]"
      - name: Compile
        run: python -m compileall -q packages services tests scripts apps
      - name: Lint
        run: ruff check packages services tests scripts
      - name: Format check
        run: ruff format --check packages services tests scripts
      - name: Unit and contract tests
        run: python -m unittest discover -s tests -v
      - name: Manifest and repository validation
        run: python -m services.cli validate && python -m services.cli doctor
      - name: Secret scan
        run: python scripts/check_secrets.py --git-history
      - name: Dependency audit
        run: python -m pip_audit
      - name: Dependency consistency
        run: python -m pip check
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: enterprise-ai-copilot-wheel
          path: dist/*.whl

  container-smoke:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compose configuration
        run: docker compose config --quiet
      - name: Build and start
        run: |
          docker compose up -d --build
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Stop stack
        if: always()
        run: docker compose down -v
