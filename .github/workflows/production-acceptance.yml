name: Production acceptance (manual)

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Protected GitHub Environment containing target credentials
        required: true
        default: production
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  acceptance:
    name: Live provider and tenant acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target_environment }}
    env:
      AGENT_PLATFORM_ENV: ${{ inputs.target_environment }}
      AGENT_PROVIDER_MODE: remote
      AGENT_STORAGE_MODE: postgres
      AGENT_DATABASE_URL: ${{ secrets.AGENT_DATABASE_URL }}
      AGENT_AUTH_MODE: oidc_jwks
      AGENT_OIDC_ISSUER: ${{ secrets.AGENT_OIDC_ISSUER }}
      AGENT_OIDC_AUDIENCE: ${{ secrets.AGENT_OIDC_AUDIENCE }}
      AGENT_OIDC_JWKS_URI: ${{ secrets.AGENT_OIDC_JWKS_URI }}
      AGENT_OIDC_ALLOWED_HOSTS: ${{ secrets.AGENT_OIDC_ALLOWED_HOSTS }}
      AGENT_MCP_ENDPOINT: ${{ secrets.AGENT_MCP_ENDPOINT }}
      AGENT_MCP_ALLOWED_HOSTS: ${{ secrets.AGENT_MCP_ALLOWED_HOSTS }}
      AGENT_MCP_BEARER_TOKEN: ${{ secrets.AGENT_MCP_BEARER_TOKEN }}
      AGENT_MCP_TIMEOUT_SECONDS: "10"
      AGENT_MODEL_ENDPOINT: ${{ secrets.AGENT_MODEL_ENDPOINT }}
      AGENT_MODEL_API_KEY: ${{ secrets.AGENT_MODEL_API_KEY }}
      AGENT_MODEL_NAME: ${{ secrets.AGENT_MODEL_NAME }}
      AGENT_MODEL_ALLOWED_HOSTS: ${{ secrets.AGENT_MODEL_ALLOWED_HOSTS }}
      AGENT_MODEL_TIMEOUT_SECONDS: "30"
      AGENT_MODEL_MAX_OUTPUT_CHARS: "4000"
      AGENT_VISION_ENDPOINT: ${{ secrets.AGENT_VISION_ENDPOINT }}
      AGENT_VISION_API_KEY: ${{ secrets.AGENT_VISION_API_KEY }}
      AGENT_VISION_MODEL: ${{ secrets.AGENT_VISION_MODEL }}
      AGENT_VISION_ALLOWED_HOSTS: ${{ secrets.AGENT_VISION_ALLOWED_HOSTS }}
      AGENT_VISION_TIMEOUT_SECONDS: "30"
      AGENT_REDIS_URL: ${{ secrets.AGENT_REDIS_URL }}
      AGENT_WORKER_USER_ID: ${{ secrets.AGENT_WORKER_USER_ID }}
      AGENT_WORKER_WORKSPACE_ID: ${{ secrets.AGENT_WORKER_WORKSPACE_ID }}
      AGENT_WORKER_TENANT_ID: ${{ secrets.AGENT_WORKER_TENANT_ID }}
      AGENT_WORKER_ROLE: ${{ secrets.AGENT_WORKER_ROLE }}
      AGENT_TRACE_ENDPOINT: ${{ secrets.AGENT_TRACE_ENDPOINT }}
      AGENT_TRACE_ALLOWED_HOSTS: ${{ secrets.AGENT_TRACE_ALLOWED_HOSTS }}
      AGENT_TRACE_BEARER_TOKEN: ${{ secrets.AGENT_TRACE_BEARER_TOKEN }}
      AGENT_TRACE_TIMEOUT_SECONDS: "5"
      AGENT_ATTACHMENT_STORAGE: s3
      AGENT_ATTACHMENT_RETENTION_DAYS: "30"
      AGENT_ATTACHMENT_REQUIRE_SCAN: "true"
      AGENT_MALWARE_SCANNER: clamav
      AGENT_CLAMAV_HOST: ${{ secrets.AGENT_CLAMAV_HOST }}
      AGENT_CLAMAV_PORT: "3310"
      AGENT_CLAMAV_TIMEOUT_SECONDS: "10"
      AGENT_S3_BUCKET: ${{ secrets.AGENT_S3_BUCKET }}
      AGENT_S3_REGION: ${{ secrets.AGENT_S3_REGION }}
      AGENT_S3_ENDPOINT: ${{ secrets.AGENT_S3_ENDPOINT }}
      AGENT_S3_ALLOWED_HOSTS: ${{ secrets.AGENT_S3_ALLOWED_HOSTS }}
      AGENT_S3_KMS_KEY_ID: ${{ secrets.AGENT_S3_KMS_KEY_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AGENT_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AGENT_S3_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AGENT_S3_SESSION_TOKEN }}
      AGENT_ACCEPTANCE_BASE_URL: ${{ secrets.AGENT_ACCEPTANCE_BASE_URL }}
      AGENT_ACCEPTANCE_ALLOWED_HOSTS: ${{ secrets.AGENT_ACCEPTANCE_ALLOWED_HOSTS }}
      AGENT_ACCEPTANCE_A_BEARER_TOKEN: ${{ secrets.AGENT_ACCEPTANCE_A_BEARER_TOKEN }}
      AGENT_ACCEPTANCE_A_WORKSPACE_ID: ${{ secrets.AGENT_ACCEPTANCE_A_WORKSPACE_ID }}
      AGENT_ACCEPTANCE_A_TENANT_ID: ${{ secrets.AGENT_ACCEPTANCE_A_TENANT_ID }}
      AGENT_ACCEPTANCE_B_BEARER_TOKEN: ${{ secrets.AGENT_ACCEPTANCE_B_BEARER_TOKEN }}
      AGENT_ACCEPTANCE_B_WORKSPACE_ID: ${{ secrets.AGENT_ACCEPTANCE_B_WORKSPACE_ID }}
      AGENT_ACCEPTANCE_B_TENANT_ID: ${{ secrets.AGENT_ACCEPTANCE_B_TENANT_ID }}
      AGENT_ACCEPTANCE_ORDER_ID: ${{ secrets.AGENT_ACCEPTANCE_ORDER_ID }}
      AGENT_ACCEPTANCE_TIMEOUT_SECONDS: "10"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install production dependencies
        run: python -m pip install --upgrade pip setuptools wheel && python -m pip install ".[production]"
      - name: Create evidence directory
        run: mkdir -p artifacts/production-acceptance
      - name: Static production preflight
        run: python -m scripts.production_preflight --json > artifacts/production-acceptance/preflight-static.json
      - name: Live dependency preflight
        run: python -m scripts.production_preflight --live --json > artifacts/production-acceptance/preflight-live.json
      - name: Live connector smoke
        run: python -m scripts.connector_smoke --confirm-live --only all | tee artifacts/production-acceptance/connector-smoke.txt
      - name: Live API identity, tenant and attachment acceptance
        run: >-
          python -m scripts.api_acceptance_smoke --confirm-live
          --json-out artifacts/production-acceptance/api-acceptance.json
      - name: Upload redacted acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: enterprise-ai-copilot-production-acceptance-${{ github.run_id }}
          retention-days: 14
          path: artifacts/production-acceptance
