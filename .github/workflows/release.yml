name: Release artifact

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip setuptools wheel && python -m pip install ".[dev,security,production]"
      - name: Validate release
        run: |
          python -m compileall -q packages services tests scripts apps
          ruff check packages services tests scripts
          ruff format --check packages services tests scripts
          python -m unittest discover -s tests -v
          python -m services.cli validate
          python scripts/check_secrets.py --git-history
          python -m pip_audit
          python -m pip check
          docker compose config --quiet
          python scripts/release_gate.py
      - name: Build wheel
        run: python -m pip wheel --no-cache-dir --no-deps --no-build-isolation --wheel-dir dist .
      - name: Create checksums
        run: sha256sum dist/*.whl > dist/SHA256SUMS
      - name: Upload release wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: enterprise-ai-copilot-${{ github.ref_name }}
          path: dist/*.whl
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.whl dist/SHA256SUMS --verify-tag --generate-notes
