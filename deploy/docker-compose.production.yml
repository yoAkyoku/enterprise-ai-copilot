services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ${AGENT_ENV_FILE:-deploy/production.env.example}
    environment:
      AGENT_API_HOST: 0.0.0.0
      AGENT_DATA_DIR: /app/.data
      AGENT_REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - agent-data:/app/.data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ${AGENT_ENV_FILE:-deploy/production.env.example}
    environment:
      AGENT_DATA_DIR: /app/.data
      AGENT_REDIS_URL: redis://redis:6379/0
      AGENT_PLATFORM_ENV: production
      AGENT_WORKER_EXECUTION_MODE: agent
    command:
      [
        "python",
        "-m",
        "services.worker.main",
        "schedules/order-status-demo.yaml",
        "--redis-url",
        "redis://redis:6379/0",
        "--queue-mode",
        "consume",
        "--execution-mode",
        "agent",
        "--worker-id",
        "production-worker",
        "--continuous"
      ]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - agent-data:/app/.data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ${AGENT_ENV_FILE:-deploy/production.env.example}
    command: ["python", "scripts/migrate_postgres.py"]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: "no"

  scheduler:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ${AGENT_ENV_FILE:-deploy/production.env.example}
    environment:
      AGENT_PLATFORM_ENV: production
      AGENT_REDIS_URL: redis://redis:6379/0
    command:
      [
        "python",
        "-m",
        "services.scheduler.main",
        "schedules/order-status-demo.yaml",
        "--redis-url",
        "redis://redis:6379/0",
        "--interval-seconds",
        "15"
      ]
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    env_file:
      - ${AGENT_ENV_FILE:-deploy/production.env.example}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  agent-data:
  redis-data:
  postgres-data:
