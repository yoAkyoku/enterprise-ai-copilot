[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-copilot"
version = "0.2.0.dev0"
description = "An open-source, self-hostable Enterprise Agent Operating Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Enterprise AI Copilot contributors" }]
dependencies = [
    "fastapi>=0.115,<1",
    "PyYAML>=6,<7",
    "Pillow>=10,<13",
    "python-multipart>=0.0.9,<1",
    "tzdata>=2024.1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
enterprise-agent-demo = "services.api.main:main"
enterprise-agent = "services.api.main:main"
enterprise-agent-cli = "services.cli:main"

[project.optional-dependencies]
dev = ["httpx2>=2,<3", "ruff==0.15.12"]
security = ["cryptography>=48.0.1,<51", "pip-audit>=2.10,<3"]
production = [
    "boto3>=1.35,<2",
    "cryptography>=48.0.1,<51",
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<9",
]

[tool.setuptools.packages.find]
include = ["apps*", "packages*", "services*"]

[tool.setuptools.package-data]
"apps.web" = ["index.html", "assets/*.css", "assets/*.js", "assets/*.svg"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
